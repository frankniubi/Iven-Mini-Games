# Builds an UNSIGNED iOS .ipa (Payload/App.app) of the 小游戏大厅 Capacitor shell and uploads it as an artifact.
# Run it from the Actions tab ("Run workflow"), or push changes under native/.
name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/ios-unsigned.yml'

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # App Store Connect wants the newest SDK: build with Xcode 27.1 / iOS 27.1 SDK.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Require Xcode 27.1 / iOS 27.1 SDK
        run: |
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK $sdk"
          lowest="$(printf '27.1\n%s\n' "$sdk" | sort -t. -k1,1n -k2,2n | head -1)"
          [ "$lowest" = "27.1" ] || { echo "::error::iOS SDK $sdk is older than 27.1"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Install dependencies
        run: npm ci   # native/.npmrc sets legacy-peer-deps (zeroconf plugin's Electron-only peer)

      - name: Build www + cap sync ios
        run: npm run www:ios

      - name: xcodebuild Release (iphoneos, unsigned) + package IPA
        run: bash scripts/build-ios-unsigned.sh --skip-www

      - uses: actions/upload-artifact@v4
        with:
          name: minigames-unsigned-ipa
          path: native/dist/minigames-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
